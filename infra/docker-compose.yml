version: "3.9"

# =============================================================================
# SDR PERPÉTUO B2B v2.0 — MÓDULO 1: INFRAESTRUTURA
# Stack: n8n + Redis + Evolution API + Nginx Proxy Manager
# Alvo: Ubuntu 22.04 LTS | DigitalOcean Droplet (2-4 GB RAM)
# =============================================================================

networks:
  sdr_net:
    driver: bridge

volumes:
  n8n_data:
  redis_data:
  evolution_data:
  nginx_data:
  nginx_letsencrypt:
  nginx_mysql:

services:

  # ---------------------------------------------------------------------------
  # NGINX PROXY MANAGER — Reverse Proxy + SSL/HTTPS (Let's Encrypt)
  # UI Admin: http://<IP>:81  (remova a porta 81 após configurar o domínio)
  # ---------------------------------------------------------------------------
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: sdr_nginx
    restart: unless-stopped
    ports:
      - "80:80"        # HTTP (redirect → HTTPS)
      - "443:443"      # HTTPS
      - "81:81"        # Admin UI (bloquear via firewall após setup inicial)
    volumes:
      - nginx_data:/data
      - nginx_letsencrypt:/etc/letsencrypt
    environment:
      DB_SQLITE_FILE: /data/database.sqlite
      DISABLE_IPV6: "true"
    networks:
      - sdr_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:81/api/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # REDIS — In-Memory Store: Cache de Blacklist + Message Broker (Bull Queue)
  # Porta 6379 exposta apenas internamente (não ao host)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sdr_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - sdr_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # N8N — Orquestrador Lógico Principal
  # Acesso direto via IP: http://157.230.210.188:5678
  # Basic Auth habilitado via variável de ambiente
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: sdr_n8n
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      # --- Instância ---
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://${N8N_HOST}:5678/
      N8N_EDITOR_BASE_URL: http://${N8N_HOST}:5678/

      # --- Segurança: Basic Auth ---
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}

      # --- Banco de dados interno (SQLite por padrão, ok para escala atual) ---
      DB_TYPE: sqlite

      # --- OTIMIZAÇÃO DE DISCO: Prune automático de execuções ---
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 24            # horas — deleta execuções bem-sucedidas após 24h
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 5000  # cap máximo de registros

      # --- Queue Mode via Redis (retentativas automáticas, Webhook resiliente) ---
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_BULL_REDIS_DB: 0

      # --- Workers e timeouts ---
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 10
      EXECUTIONS_TIMEOUT: 3600              # 1 hora máxima por execução
      EXECUTIONS_TIMEOUT_MAX: 7200

      # --- Timezone ---
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo

      # --- Telemetria off ---
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"

    networks:
      - sdr_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ---------------------------------------------------------------------------
  # N8N WORKER — Processa jobs da fila Redis em background (Queue Mode)
  # Escale horizontalmente duplicando este serviço se necessário
  # ---------------------------------------------------------------------------
  n8n-worker:
    image: n8nio/n8n:latest
    container_name: sdr_n8n_worker
    restart: unless-stopped
    command: worker
    depends_on:
      n8n:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: http
      DB_TYPE: sqlite
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_BULL_REDIS_DB: 0
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_DIAGNOSTICS_ENABLED: "false"
    networks:
      - sdr_net

  # ---------------------------------------------------------------------------
  # EVOLUTION API — Motor de Disparo WhatsApp (baileys engine)
  # Acesso direto via IP: http://157.230.210.188:8080
  # ---------------------------------------------------------------------------
  evolution-api:
    image: atendai/evolution-api:latest
    container_name: sdr_evolution
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - evolution_data:/evolution/instances
    environment:
      # --- Servidor ---
      SERVER_URL: http://${EVOLUTION_HOST}:8080
      SERVER_PORT: 8080

      # --- Auth ---
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      # --- Cache via Redis ---
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evo
      CACHE_REDIS_SAVE_INSTANCES: "true"

      # --- Banco de dados local (SQLite) ---
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: sqlite
      DATABASE_CONNECTION_URI: file:/evolution/instances/evolution.db

      # --- Logs ---
      LOG_LEVEL: ERROR
      LOG_COLOR: "true"

      # --- Comportamento de mensagem ---
      DEL_INSTANCE: "false"
      QRCODE_LIMIT: 30

      # --- Webhook global (n8n receberá eventos) ---
      WEBHOOK_GLOBAL_URL: http://${N8N_HOST}:5678/webhook/evolution
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"

      TZ: America/Sao_Paulo

    networks:
      - sdr_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
